---
# base-uc-zones.yaml — additive zone-annotation layer over dr-scripts/data/base-hunting.yaml
#
# GENERATED FIRST DRAFT. Produced once by notes/uber-combat/tools/parse-zones.rb
# (a throwaway one-shot script, not re-run automatically) against
# dr-scripts/data/base-hunting.yaml. Hand-maintain after this point per the
# accepted design in notes/uber-combat/requirements/23-loot-nav-progression.md §1
# and the amendments recorded in notes/uber-combat/99-progress.md.
#
# Placement: source of truth is custom-scripts/data/base-uc-zones.yaml; mirrored
# byte-identical to lich-5/scripts/data/custom/base-uc-zones.yaml. Edit the
# source, mirror to runtime, commit only in custom-scripts/.
#
# LOADER: reach this file as get_data('uc-zones'). Lich's to_base_filename is
# "base-#{suffix}.yaml" (lich-5/lib/common/setup_files.rb:201-203), hence the
# "base-" prefix on the filename — it is required, not decorative. The loader
# globs base*.yaml and scans scripts/data/custom/ BEFORE scripts/data/
# (setup_files.rb:181-187), so this copy wins by basename over any same-named
# file in the stock data dir.
#
# SCOPE OF THIS DRAFT (Wave 4 Packet A) — only the ~90%-extractable columns:
#   rank band (min/max), critter noun list, province, towns, source_line,
#   rank_confidence, and provenance/confidence on every field.
# Deliberately NOT emitted here (owned by other, separate Wave 4 packets):
#   - `critters:` top-level dictionary (skinnable/drops_boxes/construct/
#     undead/corporeal/cursed/ritual_eligible/arrange_type) — 0-97% extractable
#     from comments per §2's table; needs an elanthipedia pass + runtime
#     harvesting, not a comment parser. See Wave 4 packets #2/#3/#4.
#   - `cursed` / `ritual_eligible` zone or critter flags — 0% extractable from
#     comments (measured fact); left absent, to be filled by the runtime
#     harvest hook (Wave 4 packet #2).
#   - `modes:` block — per binding instruction, modes are DERIVED AT LOAD TIME
#     by the future loader, never stored. Documented below instead.
#   - room lists — 331/345 zone names already exist as Lich map-DB tags;
#     `Map.rooms_by_tag(<zone_key>)` regenerates them at load time. The 14
#     zones without a matching tag are not specially marked here; that
#     cross-check is a separate concern from comment parsing.
#   - `outdoors` / `swarm` / `requires` / `hazards` / `blacklist` /
#     `loot_additions` — near-0% extractable from comments per §2's table;
#     free-text notes are preserved verbatim in `notes:` for a human (or a
#     later packet) to mine, but were not structured here.
#
# MODE DERIVATION RULES (for the future loader — NOT stored per-zone here):
#   normal:      any_of(skinnable, drops_boxes)                   [hard any_of]
#   skin:        qualifying_ratio(skinnable)      >= threshold    [A1: default 0.6, configurable]
#   lockpick:    qualifying_ratio(drops_boxes)     >= threshold   [A1: default 0.6, configurable]
#   cleric:      qualifying_ratio(cursed)          >= threshold   [A1: default 0.6, configurable]
#   necro:       qualifying_ratio(ritual_eligible)  >= threshold  [A1: default 0.6, configurable]
#   empath:      all_of(construct OR undead)                     [A1: kept hard all_of — a non-qualifying
#                                                                   critter here is a guild-law violation
#                                                                   (attacking a living creature), not lost
#                                                                   yield, so no threshold applies]
#   mm_outdoors: zone_field(outdoors in [true, mixed])
#   "qualifying_ratio" = (# critters in the zone's `critters:` list satisfying the
#   predicate) / (# critters in the list). Requires the critters: dictionary
#   (deferred, see above) to compute; cannot be evaluated from this file alone.
#
# AMENDMENT A2 (binding, overrides §1's "union mins / first link's max"):
#   For zones whose comment block carries 2+ elanthipedia links with parseable
#   ranges, the band is (max of each link's min, min of each link's max),
#   ignoring any link whose max is unknown ('?') when computing the min-of-maxes
#   (an unknown max is treated as "no constraint from this link", never as
#   infinity). When the resulting min exceeds the resulting max, the zone is
#   flagged `rank_review: true` with a `rank_review_reason` — conservative by
#   design, since the failure mode here is death in an undead/swarm zone.
#
# AMENDMENT A3 (binding): `rank_confidence: low` is a HARD EXCLUSION from
#   auto-selection, not just an annotation. It fires when: no band was
#   parseable at all; the source comment contained a '?'; the A2 merge
#   inverted (see rank_review above); the zone's notes describe it as a
#   "flex creature" (a sentinel band, not a real one — the mechanical_mice
#   0-2000 case from §1's worked example); or the band's span exceeds
#   500 ranks (same rationale, generalized past the one
#   worked example — see the parser's run report for exactly which zones this
#   span rule caught). A per-zone opt-in override field,
#   `allow_low_confidence_auto_select: true`, is reserved for a human to set
#   by hand after verifying a specific low-confidence zone in-game; none is
#   set by this generated draft.
#
# FIELD NOTES not specified by §1's schema (this packet's own choices):
#   access:      "plain" | "escort" — mirrors which base-hunting.yaml section
#                the zone came from (hunting_zones vs escort_zones).
#   province:    for `access: plain`, taken from the ZOLUREN/ILITHI/THERENGIA/
#                FORFEDHDAR/QI'RESHALIA/FANG COVE section banner in effect.
#                Fang Cove is a 6th region present in the source file but not
#                listed among the 5 provinces named in the file's own header
#                comment or in the requirements doc; kept as its own literal
#                province value rather than folded into one of the 5.
#                For `access: escort`, taken verbatim from the trailing
#                bare-word comment line in that zone's block (per the file's
#                own header: "Escort Zones should list a province"). Two
#                escort zones (velaka_westanuryn, velaka_slavers) literally
#                say "Muspar'i" there, which is a TOWN name, not one of the
#                5 provinces — preserved verbatim as a source-data
#                inconsistency rather than silently corrected.
#   towns:       reverse-derived from `hunting_areas_by_town`; a zone with no
#                town section reference gets an empty list, not an omission.
#   alias_of:    present only on the handful of zone keys that are pure
#                backward-compatibility/typo aliases (YAML `*anchor`
#                references in base-hunting.yaml, e.g. `slyphs: *sylphs`).
#                Such a zone's rank/critters/province are copied from the
#                aliased target; `provenance.rank` reads "alias".
#   rank_review / rank_review_reason: present only when A2 inverted.
#   confidence:  a whole-zone quality rollup (not per §1's per-field
#                provenance, which is separate). "unverified" only when a
#                zone had neither a parseable epedia link nor a province
#                (i.e. essentially no signal at all); otherwise tracks
#                rank_confidence, downgraded to "medium" when province is
#                also missing.
#
# schema_version: 1 — bump if the shape below changes incompatibly.
schema_version: 1

