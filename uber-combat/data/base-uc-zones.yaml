#
# ---------------------------------------------------------------------------
# `critters:` — PER-CREATURE rank bands (Wave 5 Packet A addition)
#
# Added by notes/uber-combat/tools/parse-critters.rb (throwaway one-shot,
# see that script's own header). Extracted from the SAME comment-only
# elanthipedia annotations that feed each zone's rank band above, but kept
# at per-creature granularity instead of being collapsed into a zone band —
# the two are complementary: a zone's `rank` says what a whole zone trains,
# this section says which specific creature is the binding constraint.
#
# Keyed by the elanthipedia URL slug, decoded and MediaWiki-title-cased
# (first character forced uppercase, everything after left exactly as the
# source wrote it) — NOT by the in-game noun, because several creatures
# share a noun but are different elanthipedia pages with different bands
# (e.g. Wood_Troll_(1) 36-53 vs Rock_Troll_(1) 60-73 vs Rock_troll_(2)
# 80-115 vs Swamp_troll_(1) 120-160 vs Swamp_Troll_(2) 140-235 — five
# distinct "troll" pages/creatures, five distinct bands). 309 raw
# case-sensitive slugs appear in the source; 3 pairs (Bobcat/bobcat,
# Snaer_hafwa/snaer_hafwa, Frostweaver/frostweaver) differ ONLY in the case
# of their first letter, which MediaWiki forces to uppercase regardless —
# they are the identical wiki page and were verified to carry an identical
# band at every occurrence, so they are merged here, yielding 306 entries.
# See notes/uber-combat/34-critter-band-pass.md for the full count
# reconciliation and disclosure of this 309->306 merge.
#
# Fields per entry:
#   noun:            in-game noun, same normalization convention as each
#                     zone's `critters:` list above (decode, strip a
#                     trailing "(N)"/"(creature)" disambiguator, lowercase).
#                     NOT unique across entries — see above.
#   slug:             the raw (MediaWiki-title-cased) elanthipedia URL slug —
#                     preserved for a future elanthipedia enrichment pass
#                     (Wave 5 candidate "Critter enrichment" in 99-progress.md),
#                     which will need the exact page slug to fetch by.
#   rank.min/max:      this creature's own rank band (independent of any
#                     zone's rank band). max is null for an open-high band
#                     ("NNN-?" in the source) or when no band exists at all.
#   rank_confidence:  "low" when the source band was open-high, contained a
#                     '?' anywhere, or was entirely absent; "high" otherwise.
#   rank_notes:       present only for an odd-formatted source band (a
#                     trailing/both-sides '?', a fully-unknown "? - ?", or a
#                     missing band) — records the raw source text.
#   source_lines:     every base-hunting.yaml line (1-indexed) whose comment
#                     mentions this creature — includes duplicate mentions
#                     from hunting_areas_by_town cross-references, which
#                     repeat (not add) information already in a zone's own
#                     comment block.
#   rank_review:      present (true) only for the 5 creatures whose
#                     occurrences disagreed and were reconciled by taking
#                     the narrower band (max of mins, min of maxes —
#                     A2-style; NEVER averaged): Cougar, Piruati_serpent,
#                     Orc_raider, Young_blue-dappled_prereni,
#                     Elder_blue-dappled_prereni. See rank_review_reason and
#                     discarded_bands on each.
#   discarded_bands:  present on the 5 above (the wider, discarded band) and
#                     on Wir_dinego (the :3386 occurrence, 300-400, which is
#                     WRONG per explicit user ruling 2026-08-14 and was
#                     discarded outright rather than intersected — Wir_dinego
#                     itself carries NO rank_review flag, since this is a
#                     settled correction, not an open disagreement).
#   provenance:       {rank: "comment", slug: "comment_url_slug"} — mirrors
#                     the per-field provenance convention used elsewhere in
#                     this file.
#
# NOT covered by this pass (still deferred to the "Critter enrichment"
# candidate packet in 99-progress.md, which needs an actual elanthipedia
# fetch, not just this comment parse): skinnable / drops_boxes / construct /
# undead / corporeal / cursed / ritual_eligible / arrange_type.
# ---------------------------------------------------------------------------
